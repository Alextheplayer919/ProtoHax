name: Build Android APK

# Builds the Android app (ProtoHax-Android) into an .apk.
# The Android app depends on the ProtoHax library, so this workflow first
# publishes THIS repository's ProtoHax to Maven Local, then builds the APK
# against it. (build.yml in this repo only produces the .jar files.)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_ref:
        description: 'ProtoHax-Android branch, tag or commit to build'
        required: false
        default: 'stable'
        type: string
      build_type:
        description: 'Gradle build type to assemble'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_REPO: hax0r31337/ProtoHax-Android
      ANDROID_REF: ${{ inputs.android_ref || 'stable' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      - name: Checkout ProtoHax (library)
        uses: actions/checkout@v4
        with:
          path: ProtoHax
          submodules: recursive

      - name: Checkout ProtoHax-Android (app)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANDROID_REPO }}
          ref: ${{ env.ANDROID_REF }}
          path: ProtoHax-Android

      # ProtoHax targets JVM 11 (jvmToolchain(11), see CLAUDE.md). The Android app
      # targets 11 too, and Kotlin cannot inline bytecode newer than its target.
      - name: Set up JDK 11 (for ProtoHax)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Publish ProtoHax to Maven Local
        working-directory: ProtoHax
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      # ProtoHax-Android uses Android Gradle Plugin 8.0.x and Gradle 8.0,
      # which need JDK 17 to run.
      - name: Set up JDK 17 (for Android build)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "build-tools;33.0.1"

      # dev.sora.networking:libmitm:1.2.3-raknet is no longer published to the
      # Maven repo ProtoHax-Android declares (mccheatz.github.io is gone). It is
      # fetched from a third-party repo at a pinned commit and checked against
      # SHA-256 hashes; the build fails if either file changes.
      - name: Install libmitm (pinned, checksum-verified)
        env:
          LIBMITM_COMMIT: 460353337cd5589e8840315ee3c1e5748d3aa83b
          LIBMITM_AAR_SHA256: 596992f7f3bc1620400979d2a8a41c89f43be533f1765330127d0c769bbcbe9d
          LIBMITM_POM_SHA256: a30b148f1207e1c4635a63d80e147bb84cfa86a98de28d037f32b2024df6ab73
        run: |
          set -euo pipefail
          BASE="https://github.com/SkidderMC/ProtoHax-PackageGit/raw/${LIBMITM_COMMIT}/maven_repo/dev/sora/networking/libmitm/1.2.3-raknet"
          DEST="$HOME/.m2/repository/dev/sora/networking/libmitm/1.2.3-raknet"
          mkdir -p "$DEST"
          curl -fsSL -o "$DEST/libmitm-1.2.3-raknet.aar" "$BASE/libmitm-1.2.3-raknet.aar"
          curl -fsSL -o "$DEST/libmitm-1.2.3-raknet.pom" "$BASE/libmitm-1.2.3-raknet.pom"
          echo "${LIBMITM_AAR_SHA256}  $DEST/libmitm-1.2.3-raknet.aar" | sha256sum -c -
          echo "${LIBMITM_POM_SHA256}  $DEST/libmitm-1.2.3-raknet.pom" | sha256sum -c -

      - name: Build APK
        working-directory: ProtoHax-Android
        run: |
          set -o pipefail
          chmod +x gradlew
          TASK=":app:assemble${BUILD_TYPE^}"
          echo "Running: ./gradlew $TASK"
          ./gradlew "$TASK" --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"

      - name: Summarize Gradle errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-apk.log"
          [ -f "$LOG" ] || exit 0
          {
            grep -E '^e: |^error:' "$LOG"
            awk '/What went wrong:/{f=1} /^\* Try:/{f=0} f' "$LOG"
            grep -E 'Execution failed for|Could not (resolve|find|determine)' "$LOG"
          } | sed -e 's/\r//g' -e 's/%/%25/g' | grep -v '^\s*$' | head -60 | while IFS= read -r line; do
            echo "::error title=Gradle::$line"
          done

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-apk-log-${{ github.sha }}
          path: ${{ runner.temp }}/gradle-apk.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: protohax-apk-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: ProtoHax-Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
